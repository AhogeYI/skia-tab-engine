name: ci

# Chrome-style per-platform gate, distilled for a single library:
# - Tier 1 (every push/PR): the platform-neutral core builds and tests on all
#   three PC desktop platforms, in Debug and Release. A Windows-only
#   dependency cannot leak into the contracts, model, layout, or theme
#   unnoticed on any of them.
# - Tier 2 (the Windows Skia shell and SDK): owned by tools/sdk.py end to
#   end. The job is written but disabled until a hosted runner image is
#   verified to carry the Visual Studio 18 2026 generator the SDK builder
#   requires; enable it and validate once via workflow_dispatch before
#   making it blocking.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }}, ${{ matrix.build-type }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # -D overrides the preset's default; on the Windows multi-config
      # generator CMAKE_BUILD_TYPE is ignored and --config/-C select instead.
      - name: Configure
        run: cmake --preset core -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build --preset core --config ${{ matrix.build-type }}

      - name: Test
        run: ctest --preset core -C ${{ matrix.build-type }}

  # Tier 2 placeholder. Kept in-tree (disabled) so enabling the Windows
  # binary path in CI is a one-line flip plus a verified toolchain check.
  windows-sdk:
    name: windows sdk (runner toolchain unverified)
    if: false
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build pinned Skia (shared DLL)
        run: python tools/sdk.py build-skia --config ${{ matrix.configuration }}

      - name: Build and test Windows contracts
        shell: pwsh
        run: |
          $config = '${{ matrix.configuration }}'
          cmake -S . -B "build/sdk-tests/$config" -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON -DTABENGINE_BUILD_SKIA=ON "-DTABENGINE_SKIA_ROOT=$PWD/build/skia-shared/$config"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/sdk-tests/$config" --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "build/sdk-tests/$config" -C $config --output-on-failure --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify the SDK
        run: |
          python tools/sdk.py package --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/sdk.py verify --config ${{ matrix.configuration }}

  tools:
    name: SDK distribution and control tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test SDK distribution guards
        run: python3 tests/sdk_packaging_test.py
      - name: Install locked MCP dependencies
        working-directory: tools/mcp
        run: npm ci --omit=dev --no-fund --no-audit
      - name: Test panel and MCP contracts
        run: |
          node tools/devtools/panel_test.mjs
          node tools/devtools/panel_dom_test.mjs
          node tools/mcp/regression_test.mjs
